# Netlify build config for the Blaze Cannabis storefront (Next.js).
#
# This app sits at the repository root, so in the Netlify UI leave
# "Base directory", "Build command" and "Publish directory" all BLANK —
# everything is supplied here. Typing values into those fields overrides
# this file and breaks the build.
#
# Set NEXT_PUBLIC_PREVIEW_BANNER=true to show the "Design preview" notice.
# Leave CATALOG_SOURCE unset: the site then runs on the committed local
# catalog and cannot be broken by a third-party API being down.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# This deploy is a design preview carrying the client's real branding,
# address and inventory. Keeping it out of search engines matters: an
# indexed result pointing here could be taken for the real storefront,
# and the client is a licensed retailer whose live site is subject to
# AGCO review. Remove these headers only when this becomes the real site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
